name: SaaS Control Plane CI

on:
  push:
    paths:
      - "services/keddeh-saas-control-plane/**"
      - "runtime/illlm_ledger.py"
      - "runtime/runtime_registry.py"
  pull_request:
    paths:
      - "services/keddeh-saas-control-plane/**"
      - "runtime/illlm_ledger.py"
      - "runtime/runtime_registry.py"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/keddeh-saas-control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: python -m compileall -q src tests ../../runtime/illlm_ledger.py ../../runtime/runtime_registry.py
      - run: pytest -q
      - name: Build Linux image from BRAINK repository context
        working-directory: ${{ github.workspace }}
        run: docker build -f services/keddeh-saas-control-plane/Dockerfile -t keddeh-saas-control-plane:ci .
