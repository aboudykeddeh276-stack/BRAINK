name: KEDDEH V99 Four Plane Context Framework

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v98_protocol_compliance_config/**'
      - '.github/workflows/v99-four-plane-context-framework.yml'

permissions:
  contents: read

jobs:
  four-plane-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run four-plane framework
        run: |
          cd v98_protocol_compliance_config
          python3 -m compileall src tests
          python3 src/keddeh_four_plane_context_framework.py --root . --emit-receipt
          python3 -m unittest tests.test_four_plane_context_framework -v
      - name: Upload four-plane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keddeh-v99-four-plane-context-framework
          path: |
            v98_protocol_compliance_config/evidence/four_plane_context_framework_receipt.json
            v98_protocol_compliance_config/exports/four_plane_context_framework_matrix.csv
            v98_protocol_compliance_config/exports/four_plane_cross_plane_guards.csv
            v98_protocol_compliance_config/runtime_volume/outbox/four_plane_context_framework/
