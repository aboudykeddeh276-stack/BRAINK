name: KEX Canonical State

on:
  push:
    branches: [main]
    paths:
      - 'modules/kex_core/**'
      - 'modules/kex_wbos/canonical_action_runtime.py'
      - 'scripts/kex-ci/test_canonical_state.py'
      - 'scripts/kex-ci/test_canonical_wbos.py'
      - '.github/workflows/kex-canonical-state.yml'
  pull_request:
    paths:
      - 'modules/kex_core/**'
      - 'modules/kex_wbos/canonical_action_runtime.py'
      - 'scripts/kex-ci/test_canonical_state.py'
      - 'scripts/kex-ci/test_canonical_wbos.py'
      - '.github/workflows/kex-canonical-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-state-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install resident WBOS dependency
        run: python -m pip install openpyxl
      - name: Execute canonical core traversal proof
        run: python scripts/kex-ci/test_canonical_state.py
      - name: Execute canonical WBOS action proof
        run: python scripts/kex-ci/test_canonical_wbos.py
      - name: Read back receipts
        run: |
          cat reports/kex-core/canonical-state-test.json
          cat reports/kex-wbos/canonical-wbos-test.json
          tail -n 1 reports/kex-wbos/canonical-action-ledger.jsonl
      - name: Upload proof receipts
        uses: actions/upload-artifact@v4
        with:
          name: kex-canonical-state-proof
          path: |
            reports/kex-core/canonical-state-test.json
            reports/kex-wbos/canonical-wbos-test.json
            reports/kex-wbos/canonical-action-ledger.jsonl
