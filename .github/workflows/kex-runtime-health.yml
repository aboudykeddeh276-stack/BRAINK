name: KEX Runtime Health

on:
  workflow_dispatch:
    inputs:
      strict_unresolved:
        description: "Fail when required runtime implementation surfaces are absent"
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types: [kex-runtime-full-validation]
  push:
    branches: [main]
    paths:
      - ".kex/**"
      - "scripts/kex-ci/**"
      - ".github/workflows/kex-*.yml"
      - "kex/**"
      - "modules/**"
      - "deploy/**"

permissions:
  contents: read

jobs:
  runtime-validation:
    name: health-runtime
    runs-on:
      - self-hosted
      - kex
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute R23 dependency bindings
        run: python3 scripts/kex-ci/test_r23_dependency_bindings.py
      - name: Execute runtime validation
        run: |
          STRICT=""
          if [ "${{ inputs.strict_unresolved }}" = "true" ]; then STRICT="--strict-unresolved"; fi
          python3 scripts/kex-ci/validate_control_plane.py --mode health $STRICT
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kex-health-${{ github.run_id }}-runtime
          path: reports/kex-ci/health.json
          if-no-files-found: error
