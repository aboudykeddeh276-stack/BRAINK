name: KEX Runtime Health

on:
  workflow_dispatch:
    inputs:
      use_self_hosted:
        description: "Also execute on the specialist self-hosted KEX runner"
        required: false
        default: false
        type: boolean
      strict_unresolved:
        description: "Fail when required runtime implementation surfaces are absent"
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types: [kex-runtime-full-validation]
  push:
    branches: [main]
    paths:
      - ".kex/**"
      - "scripts/kex-ci/**"
      - ".github/workflows/kex-*.yml"
      - "kex/**"
      - "modules/**"
      - "deploy/**"

permissions:
  contents: read

jobs:
  control-plane:
    name: health-control-plane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository surface
        run: python scripts/kex-ci/validate_control_plane.py --mode health
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kex-health-${{ github.run_id }}-control
          path: reports/kex-ci/health.json
          if-no-files-found: error

  specialist:
    name: health-specialist
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_self_hosted }}
    runs-on:
      - self-hosted
      - kex
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Execute specialist validation
        run: |
          STRICT=""
          if [ "${{ inputs.strict_unresolved }}" = "true" ]; then STRICT="--strict-unresolved"; fi
          python3 scripts/kex-ci/validate_control_plane.py --mode health $STRICT
      - name: Upload specialist receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kex-health-${{ github.run_id }}-specialist
          path: reports/kex-ci/health.json
          if-no-files-found: error
