name: BRAINK Runtime Publish

on:
  pull_request:
    paths:
      - 'runtime/publish/**'
      - '.github/workflows/braink-runtime-publish.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/publish/**'
      - '.github/workflows/braink-runtime-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: PYTHONPATH=src pytest -q

  container:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: runtime/publish
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/braink-runtime:0.1.0
            ghcr.io/${{ github.repository_owner }}/braink-runtime:latest
