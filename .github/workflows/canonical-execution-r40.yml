name: BRAINK R40 Canonical Execution

on:
  push:
    branches: ['kex/canonical-execution-r40']
    paths:
      - 'enterprise/canonical_execution_r40.py'
      - 'enterprise/data_class_registry_r40.py'
      - 'enterprise/node_vfs_r40.py'
      - 'enterprise/node_lease_r40.py'
      - 'enterprise/kdrive_ring_buffer_r40.py'
      - 'enterprise/cascade_topology_r40.py'
      - 'enterprise/metacircular_vfs_executor_r40.py'
      - 'enterprise/gcs_content_replica_r40.py'
      - 'enterprise/global_illlm_r40.py'
      - 'enterprise/fabric_admission_r40.py'
      - 'enterprise/fabric_proof_relay_r40.py'
      - 'enterprise/runtime/resource_scheduler_r40.py'
      - 'enterprise/capability_deployment_runtime.py'
      - 'enterprise/addressability_fabric.py'
      - 'deployment/kex_runtime_service_r40.py'
      - 'deployment/kex_canonical_cli_r40.py'
      - 'deployment/kex_canonical_stream_r40.py'
      - 'deployment/colab_gcsfuse_bootstrap_r40.py'
      - 'runtime/framed_json_r40.py'
      - 'control/AUTHORITY_CONTROL_R34.json'
      - 'control/CANONICAL_EXECUTION_REQUIREMENT_EVIDENCE_R40.json'
      - 'control/RING_APERTURE_LEASE_EVIDENCE_R40.json'
      - 'control/CASCADE_TOPOLOGY_EVIDENCE_R40.json'
      - 'control/METACIRCULAR_VFS_EVIDENCE_R40.json'
      - 'control/GCS_FAILOVER_EVIDENCE_R40.json'
      - 'control/__init__.py'
      - 'pyproject.toml'
      - 'tests/R40/**'
      - 'scripts/kex-ci/benchmark_canonical_execution_r40.py'
      - 'scripts/kex-ci/test_r40_process_restart.py'
      - '.github/workflows/canonical-execution-r40.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resident-r40-verify-build-deploy:
    runs-on: [self-hosted, kex, cascade, hyperk0, warmboot]
    timeout-minutes: 30
    steps:
      - name: Checkout canonical branch state
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Read back resident verification tooling
        run: |
          python3 --version
          python3 - <<'PY'
          import importlib.util, json
          required = ['pytest', 'build', 'setuptools', 'wheel']
          missing = [name for name in required if importlib.util.find_spec(name) is None]
          print(json.dumps({'required': required, 'missing': missing}, sort_keys=True))
          if missing:
              raise SystemExit('BLOCKED:RESIDENT_BUILD_TEST_TOOLING:' + ','.join(missing))
          PY

      - name: Compile canonical and inherited execution surface
        run: >-
          python3 -m compileall -q
          enterprise deployment runtime
          tests/R26 tests/R40
          tests/R39/test_resident_root_projection_r39.py
          scripts/kex-ci/benchmark_canonical_execution_r40.py
          scripts/kex-ci/test_r40_process_restart.py

      - name: R40 unit falsification integration tests
        run: python3 -m pytest -q tests/R40

      - name: Inherited R26 R30 R39 regression tests
        run: python3 -m pytest -q tests/R26 tests/R39/test_resident_root_projection_r39.py

      - name: Process termination restart recovery
        run: python3 scripts/kex-ci/test_r40_process_restart.py | tee R40_PROCESS_RESTART_RECEIPT.json

      - name: Measurement-only benchmark
        run: python3 scripts/kex-ci/benchmark_canonical_execution_r40.py | tee R40_BENCHMARK.json

      - name: Build resident setuptools wheel and source distribution
        run: python3 -m build

      - name: Verify installed wheel outside source tree without network dependencies
        run: |
          rm -rf .r40-wheel-venv
          python3 -m venv .r40-wheel-venv
          .r40-wheel-venv/bin/python -m pip install --no-deps --force-reinstall dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.r40-wheel-venv/bin/braink-canonical-r40" --help
          "$GITHUB_WORKSPACE/.r40-wheel-venv/bin/braink-kex-runtime-r40" --help
          "$GITHUB_WORKSPACE/.r40-wheel-venv/bin/braink-canonical-stream-r40" --help

      - name: Checksums and release bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, tarfile
          files = sorted(p for p in Path('dist').iterdir() if p.is_file())
          sums = []
          for path in files:
              sums.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path}")
          Path('R40_SHA256SUMS.txt').write_text('\n'.join(sums) + '\n')
          bundle = Path('BRAINK_KEX_R40_RELEASE.tar.gz')
          with tarfile.open(bundle, 'w:gz') as tf:
              tf.add('dist')
              for name in ['R40_SHA256SUMS.txt', 'R40_PROCESS_RESTART_RECEIPT.json', 'R40_BENCHMARK.json']:
                  tf.add(name)
          Path(str(bundle)+'.sha256').write_text(hashlib.sha256(bundle.read_bytes()).hexdigest() + '  ' + str(bundle) + '\n')
          PY

      - name: Resident deployment mechanism
        run: python3 deployment/full_epic_deploy_r27.py

      - name: Deployed runtime readback
        run: python3 deployment/full_epic_deploy_r27.py --verify-only

      - name: Upload qualified R40 build evidence
        uses: actions/upload-artifact@v4
        with:
          name: braink-kex-r40-qualified-build
          path: |
            dist/*
            R40_SHA256SUMS.txt
            R40_PROCESS_RESTART_RECEIPT.json
            R40_BENCHMARK.json
            BRAINK_KEX_R40_RELEASE.tar.gz
            BRAINK_KEX_R40_RELEASE.tar.gz.sha256
