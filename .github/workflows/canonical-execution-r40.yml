name: BRAINK R40 Canonical Execution

on:
  push:
    branches: ['kex/canonical-execution-r40']
    paths:
      - 'enterprise/canonical_execution_r40.py'
      - 'enterprise/data_class_registry_r40.py'
      - 'enterprise/node_vfs_r40.py'
      - 'enterprise/global_illlm_r40.py'
      - 'enterprise/fabric_admission_r40.py'
      - 'enterprise/runtime/resource_scheduler_r40.py'
      - 'enterprise/capability_deployment_runtime.py'
      - 'deployment/kex_runtime_service_r40.py'
      - 'deployment/kex_canonical_cli_r40.py'
      - 'control/AUTHORITY_CONTROL_R34.json'
      - 'control/__init__.py'
      - 'pyproject.toml'
      - 'tests/R40/**'
      - 'scripts/kex-ci/benchmark_canonical_execution_r40.py'
      - 'scripts/kex-ci/test_r40_process_restart.py'
      - '.github/workflows/canonical-execution-r40.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r40-verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch state
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install verification/build tooling
        run: python -m pip install --disable-pip-version-check pytest build

      - name: Compile R40 execution path
        run: >-
          python -m compileall -q
          enterprise/canonical_execution_r40.py
          enterprise/data_class_registry_r40.py
          enterprise/node_vfs_r40.py
          enterprise/global_illlm_r40.py
          enterprise/fabric_admission_r40.py
          enterprise/runtime/resource_scheduler_r40.py
          enterprise/capability_deployment_runtime.py
          deployment/kex_runtime_service_r40.py
          deployment/kex_canonical_cli_r40.py
          tests/R40
          scripts/kex-ci/benchmark_canonical_execution_r40.py
          scripts/kex-ci/test_r40_process_restart.py

      - name: R40 unit falsification integration tests
        run: pytest -q tests/R40

      - name: Inherited R26 R30 R39 regression tests
        run: pytest -q tests/R26 tests/R39/test_resident_root_projection_r39.py

      - name: Process termination restart recovery
        run: python scripts/kex-ci/test_r40_process_restart.py | tee R40_PROCESS_RESTART_RECEIPT.json

      - name: Measurement-only benchmark
        run: python scripts/kex-ci/benchmark_canonical_execution_r40.py | tee R40_BENCHMARK.json

      - name: Build resident setuptools wheel and source distribution
        run: python -m build

      - name: Verify installed wheel entry points outside source tree
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          braink-canonical-r40 --help
          braink-kex-runtime-r40 --help

      - name: Checksums and release bundle
        run: |
          sha256sum dist/* > R40_SHA256SUMS.txt
          tar -czf BRAINK_KEX_R40_RELEASE.tar.gz dist R40_SHA256SUMS.txt R40_PROCESS_RESTART_RECEIPT.json R40_BENCHMARK.json
          sha256sum BRAINK_KEX_R40_RELEASE.tar.gz > BRAINK_KEX_R40_RELEASE.tar.gz.sha256

      - name: Upload qualified R40 build evidence
        uses: actions/upload-artifact@v4
        with:
          name: braink-kex-r40-qualified-build
          path: |
            dist/*
            R40_SHA256SUMS.txt
            R40_PROCESS_RESTART_RECEIPT.json
            R40_BENCHMARK.json
            BRAINK_KEX_R40_RELEASE.tar.gz
            BRAINK_KEX_R40_RELEASE.tar.gz.sha256

  resident-r26-regression-deploy:
    needs: r40-verify-build
    runs-on: [self-hosted, kex, cascade, hyperk0, warmboot]
    timeout-minutes: 20
    steps:
      - name: Checkout qualified branch state
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Compile resident execution surface
        run: python3 -m compileall -q enterprise deployment runtime tests/R26 tests/R40

      - name: Full inherited recursive runtime regression
        run: python3 -m pytest -q tests/R26 tests/R40 tests/R39/test_resident_root_projection_r39.py

      - name: Resident deployment mechanism
        run: python3 deployment/full_epic_deploy_r27.py

      - name: Deployed runtime readback
        run: python3 deployment/full_epic_deploy_r27.py --verify-only
