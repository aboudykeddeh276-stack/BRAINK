name: BRAINK Active Runtime External Observer R16

on:
  push:
    branches:
      - build/service-supervisor-s1-host-survey
    paths:
      - runtime/braink_external_probe_r15.sh
      - .github/workflows/braink-external-observer-r16.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-runtime-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout BRAINK
        uses: actions/checkout@v4
      - name: Execute R16 external observer
        shell: bash
        run: |
          set -euo pipefail
          echo "R16_RUNNER_ACTIVE=1"
          uname -a
          python3 --version
          curl --version | head -n 1
          chmod +x runtime/braink_external_probe_r15.sh
          mkdir -p reports/r16
          runtime/braink_external_probe_r15.sh keddeh.com reports/r16/BRAINK_R16_EXTERNAL_OBSERVER_RECEIPT.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/r16/BRAINK_R16_EXTERNAL_OBSERVER_RECEIPT.json')
          r=json.loads(p.read_text())
          r['runner_active']=True
          r['runtime_branch']='build/service-supervisor-s1-host-survey'
          p.write_text(json.dumps(r,indent=2))
          print(p.read_text())
          assert r['status'] in {'PASS_PUBLIC_OBSERVED','PASS_BOUNDARY_CLASSIFIED'}
          PY
      - name: Upload R16 receipt
        uses: actions/upload-artifact@v4
        with:
          name: BRAINK_R16_EXTERNAL_OBSERVER_RECEIPT
          path: reports/r16/BRAINK_R16_EXTERNAL_OBSERVER_RECEIPT.json
          if-no-files-found: error
          retention-days: 7
