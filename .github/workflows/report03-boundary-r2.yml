name: Report 03 KEX Boundary R2
on:
  pull_request:
    paths:
      - 'observer2_runtime/**'
      - 'runtime/publish/src/braink_runtime/**'
      - 'runtime/publish/tests/**'
      - '.github/workflows/report03-boundary-r2.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Compile
        run: python -m compileall -q observer2_runtime runtime/publish/src/braink_runtime
      - name: Symbolic boundary
        run: PYTHONPATH="runtime/publish/src:." python -m pytest -q tests/test_kex_symbolic_bridge.py
      - name: Report 03 core
        run: PYTHONPATH="runtime/publish/src:." python -m pytest -q runtime/publish/tests/test_report03_engineering.py
      - name: Report 03 boundary integration
        run: PYTHONPATH="runtime/publish/src:." python -m pytest -q runtime/publish/tests/test_report03_kex_boundary_integration.py
