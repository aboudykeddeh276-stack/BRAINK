name: KEX Capability Runner Deploy (Optional Carrier)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-and-deploy:
    runs-on: [self-hosted, kex, tl2]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Direct KEX-first deployment
        shell: bash
        run: BRAINK_ROOT="$GITHUB_WORKSPACE" bash deploy/braink_saas_direct.sh
      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kex-direct-deploy-${{ github.run_id }}
          path: reports/direct-deploy/*.json
          if-no-files-found: warn

# Optional remote trigger only. It does not own deployment authority.
# The same actuator runs directly on a KEX/BRAINK host without GitHub.
