name: KEDDEH Enterprise Control Validation

on:
  pull_request:
    paths:
      - 'enterprise/**'
      - 'scripts/kex-ci/test_enterprise_control.py'
      - 'scripts/kex-ci/test_addressability_fabric.py'
      - 'scripts/kex-ci/test_evolution_paths.py'
      - 'scripts/kex-ci/test_self_evolution_runtime.py'
      - 'scripts/kex-ci/test_autonomous_evolution_runtime.py'
      - 'scripts/kex-ci/test_route_actuation_runtime.py'
      - 'scripts/kex-ci/test_market_control_plane.py'
      - 'scripts/kex-ci/test_capability_deployment_runtime.py'
      - 'scripts/kex-ci/test_architecture_verification_r19.py'
      - '.github/workflows/keddeh-enterprise-control.yml'
  push:
    branches: [main]
    paths:
      - 'enterprise/**'
      - 'scripts/kex-ci/test_enterprise_control.py'
      - 'scripts/kex-ci/test_addressability_fabric.py'
      - 'scripts/kex-ci/test_evolution_paths.py'
      - 'scripts/kex-ci/test_self_evolution_runtime.py'
      - 'scripts/kex-ci/test_autonomous_evolution_runtime.py'
      - 'scripts/kex-ci/test_route_actuation_runtime.py'
      - 'scripts/kex-ci/test_market_control_plane.py'
      - 'scripts/kex-ci/test_capability_deployment_runtime.py'
      - 'scripts/kex-ci/test_architecture_verification_r19.py'
      - '.github/workflows/keddeh-enterprise-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile enterprise control modules
        run: python -m compileall -q enterprise scripts/kex-ci/test_enterprise_control.py scripts/kex-ci/test_addressability_fabric.py scripts/kex-ci/test_evolution_paths.py scripts/kex-ci/test_self_evolution_runtime.py scripts/kex-ci/test_autonomous_evolution_runtime.py scripts/kex-ci/test_route_actuation_runtime.py scripts/kex-ci/test_market_control_plane.py scripts/kex-ci/test_capability_deployment_runtime.py scripts/kex-ci/test_architecture_verification_r19.py
      - name: Execute enterprise invariants
        run: python scripts/kex-ci/test_enterprise_control.py
      - name: Execute addressability fabric invariants
        run: python scripts/kex-ci/test_addressability_fabric.py
      - name: Execute update-amend-evolve invariants
        run: python scripts/kex-ci/test_evolution_paths.py
      - name: Execute self-evolution runtime invariants
        run: python scripts/kex-ci/test_self_evolution_runtime.py
      - name: Execute autonomous evolution runtime invariants
        run: python scripts/kex-ci/test_autonomous_evolution_runtime.py
      - name: Execute route and actuation invariants
        run: python scripts/kex-ci/test_route_actuation_runtime.py
      - name: Execute market control plane invariants
        run: python scripts/kex-ci/test_market_control_plane.py
      - name: Execute capability deployment runtime invariants
        run: python scripts/kex-ci/test_capability_deployment_runtime.py
      - name: Execute architecture verification invariants
        run: python scripts/kex-ci/test_architecture_verification_r19.py
