name: KEDDEH Enterprise Control Validation

on:
  pull_request:
    paths:
      - 'enterprise/**'
      - 'governance/**'
      - 'deployment/**'
      - 'deployments/**'
      - 'scripts/kex-ci/**'
      - '.github/workflows/keddeh-enterprise-control.yml'
  push:
    branches: [main]
    paths:
      - 'enterprise/**'
      - 'governance/**'
      - 'deployment/**'
      - 'deployments/**'
      - 'scripts/kex-ci/**'
      - '.github/workflows/keddeh-enterprise-control.yml'
  workflow_dispatch:
    inputs:
      use_self_hosted:
        description: 'Also execute on the specialist KEX self-hosted runner'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile enterprise control modules
        run: python -m compileall -q enterprise deployment scripts/kex-ci
      - name: Execute enterprise invariants
        run: python scripts/kex-ci/test_enterprise_control.py
      - name: Execute addressability fabric invariants
        run: python scripts/kex-ci/test_addressability_fabric.py
      - name: Execute update-amend-evolve invariants
        run: python scripts/kex-ci/test_evolution_paths.py
      - name: Execute self-evolution runtime invariants
        run: python scripts/kex-ci/test_self_evolution_runtime.py
      - name: Execute autonomous evolution runtime invariants
        run: python scripts/kex-ci/test_autonomous_evolution_runtime.py
      - name: Execute route and actuation invariants
        run: python scripts/kex-ci/test_route_actuation_runtime.py
      - name: Execute market control plane invariants
        run: python scripts/kex-ci/test_market_control_plane.py
      - name: Execute capability deployment runtime invariants
        run: python scripts/kex-ci/test_capability_deployment_runtime.py
      - name: Execute architecture verification invariants
        run: python scripts/kex-ci/test_architecture_verification_r19.py
      - name: Execute R24 engineering control plane invariants
        run: python scripts/kex-ci/test_engineering_control_plane_r24.py
      - name: Execute R24 torn-tail recovery invariant
        run: python scripts/kex-ci/test_engineering_ledger_recovery_r24.py
      - name: Execute R23 owner-host activation invariant
        run: python scripts/kex-ci/test_r23_owner_host_runtime.py
      - name: Execute R24 customer portal HTTP binding invariant
        run: python scripts/kex-ci/test_r24_customer_portal_http_binding.py
      - name: Execute R24 R23 public-state privacy invariant
        run: python scripts/kex-ci/test_r23_privacy_state_boundary_r24.py
      - name: Execute R27 real runtime route and recovery invariant
        run: python scripts/kex-ci/test_runtime_fabric_real_routes_r27.py
      - name: Execute R24 BRAINK MCP adapter invariant
        run: python scripts/kex-ci/test_braink_mcp_r24.py
      - name: Execute R24 publication/domain promotion gate
        run: python scripts/kex-ci/test_r24_publication_domain_gate.py

  specialist:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.use_self_hosted) }}
    runs-on: [self-hosted, kex, cascade, hyperk0, warmboot]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile enterprise control modules
        run: python3 -m compileall -q enterprise deployment scripts/kex-ci
      - name: Execute R24 engineering control plane invariants
        run: python3 scripts/kex-ci/test_engineering_control_plane_r24.py
      - name: Execute R24 torn-tail recovery invariant
        run: python3 scripts/kex-ci/test_engineering_ledger_recovery_r24.py
      - name: Execute R23 owner-host activation invariant
        run: python3 scripts/kex-ci/test_r23_owner_host_runtime.py
      - name: Execute R24 customer portal HTTP binding invariant
        run: python3 scripts/kex-ci/test_r24_customer_portal_http_binding.py
      - name: Execute R24 R23 public-state privacy invariant
        run: python3 scripts/kex-ci/test_r23_privacy_state_boundary_r24.py
      - name: Execute R27 real runtime route and recovery invariant
        run: python3 scripts/kex-ci/test_runtime_fabric_real_routes_r27.py
      - name: Execute R24 BRAINK MCP adapter invariant
        run: python3 scripts/kex-ci/test_braink_mcp_r24.py
      - name: Execute R24 publication/domain promotion gate
        run: python3 scripts/kex-ci/test_r24_publication_domain_gate.py
