name: Independent BRAINK Fabric PR Qualification

on:
  pull_request:
    paths:
      - 'enterprise/resident_root_runtime.py'
      - 'enterprise/remote_fabric_node.py'
      - 'modules/kex_core/**'
      - 'runtime/**'
      - 'deployment/bootstrap_keddeh_fabric.py'
      - 'dependency-graph/**'
      - 'tests/integration/test_resident_root_runtime.py'
      - '.github/workflows/independent-remote-fabric-pr-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  RENDEZVOUS_ISSUE: '66'

jobs:
  independent-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: aboudykeddeh276-stack/SERVERS-KEDDEHSYSTEMS
          path: dependencies/SERVERS-KEDDEHSYSTEMS

      - name: Resolve resident state before network projection
        run: |
          set -euo pipefail
          mkdir -p build/remote
          python3 enterprise/resident_root_runtime.py --root . --output build/remote/roots.json
          python3 -m pytest -q tests/integration/test_resident_root_runtime.py

      - name: Start resident-bound BRAINK node
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out build/remote/private.pem
          openssl pkey -in build/remote/private.pem -pubout -out build/remote/public.pem
          python3 enterprise/remote_fabric_node.py \
            --host 127.0.0.1 --port 8787 \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-id "$GITHUB_RUN_ID" \
            --private-key build/remote/private.pem \
            --public-key build/remote/public.pem \
            --resident-roots build/remote/roots.json \
            --receipts build/remote/receipts.jsonl \
            > build/remote/node.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8787/identity > build/remote/identity.json && break
            sleep 1
          done
          test -s build/remote/identity.json

      - name: Project through public carrier and publish rendezvous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -LfsS -o build/remote/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 || {
            echo 'CARRIER_PROJECTION_FAILED:download'; exit 1; }
          chmod +x build/remote/cloudflared
          build/remote/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8787 > build/remote/tunnel.log 2>&1 &
          endpoint=''
          for i in $(seq 1 45); do
            endpoint=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' build/remote/tunnel.log | tail -1 || true)
            [ -n "$endpoint" ] && break
            sleep 1
          done
          [ -n "$endpoint" ] || { echo 'CARRIER_PROJECTION_FAILED:endpoint'; cat build/remote/tunnel.log; exit 1; }
          ENDPOINT="$endpoint" python3 - <<'PY'
          import json,os,time,urllib.request
          local=json.load(open('build/remote/roots.json'))
          for _ in range(20):
              try:
                  with urllib.request.urlopen(os.environ['ENDPOINT']+'/identity',timeout=4) as r: ident=json.load(r)
                  with urllib.request.urlopen(os.environ['ENDPOINT']+'/roots',timeout=4) as r: roots=json.load(r)
                  assert ident['resident_graph_digest']==local['graph_digest']==roots['graph_digest']
                  break
              except Exception: time.sleep(2)
          else: raise SystemExit('CARRIER_PROJECTION_FAILED:readback')
          PY
          identity=$(ENDPOINT="$endpoint" python3 - <<'PY'
          import json,os,urllib.request
          with urllib.request.urlopen(os.environ['ENDPOINT']+'/identity',timeout=5) as r:d=json.load(r)
          keep=('node_id','commit_sha','run_id','public_key_sha256','resident_graph_digest','root_digests')
          print(json.dumps({k:d[k] for k in keep},sort_keys=True,separators=(',',':')))
          PY
          )
          body="BRAINK_REMOTE_RENDEZVOUS run_id=${GITHUB_RUN_ID} endpoint=${endpoint} identity=${identity}"
          curl -fsS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${RENDEZVOUS_ISSUE}/comments" \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"body":sys.argv[1]}))' "$body")" \
            > build/remote/rendezvous-response.json
          echo "CARRIER_PROJECTED $endpoint"

      - name: Hold host and require fabric readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            joined=$(python3 - <<'PY'
          import json,os,urllib.request
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['RENDEZVOUS_ISSUE']}/comments?per_page=100",
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=10) as r:c=json.load(r)
          marker=f"BRAINK_FABRIC_JOINED run_id={os.environ['GITHUB_RUN_ID']}"
          print('1' if any(marker in x.get('body','') for x in c) else '')
          PY
          )
            [ "$joined" = 1 ] && { echo FABRIC_JOINED; cat build/remote/receipts.jsonl; exit 0; }
            curl -fsS http://127.0.0.1:8787/health >/dev/null
            sleep 5
          done
          exit 1

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-braink-remote-${{ github.sha }}
          path: build/remote/
          if-no-files-found: error

  existing-fabric:
    runs-on:
      - self-hosted
      - kex
      - cascade
      - hyperk0
      - warmboot
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: aboudykeddeh276-stack/SERVERS-KEDDEHSYSTEMS
          path: dependencies/SERVERS-KEDDEHSYSTEMS

      - name: Resolve local resident state
        run: |
          set -euo pipefail
          mkdir -p build/join
          python3 enterprise/resident_root_runtime.py --root . --output build/join/roots.json

      - name: Wait for resident-bound remote rendezvous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            python3 - <<'PY' > build/join/rendezvous.json || true
          import json,os,re,urllib.request
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['RENDEZVOUS_ISSUE']}/comments?per_page=100",
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=10) as r:c=json.load(r)
          marker=f"BRAINK_REMOTE_RENDEZVOUS run_id={os.environ['GITHUB_RUN_ID']} "
          body=next((x['body'] for x in reversed(c) if x.get('body','').startswith(marker)),None)
          if not body: raise SystemExit(1)
          m=re.search(r' endpoint=(https://[^ ]+) identity=(\{.*\})$',body)
          if not m: raise SystemExit(2)
          print(json.dumps({'endpoint':m.group(1),'identity':json.loads(m.group(2))}))
          PY
            [ -s build/join/rendezvous.json ] && break
            sleep 5
          done
          test -s build/join/rendezvous.json

      - name: Verify resident identity and signed join
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib,secrets,urllib.request
          p=pathlib.Path('build/join')
          local=json.load(open(p/'roots.json'))
          rd=json.load(open(p/'rendezvous.json'))
          ident0=rd['identity']
          assert ident0['resident_graph_digest']==local['graph_digest']
          for rid in ('BRAINK_ROOT','SERVER_ROOT','CLOUD_ROOT'):
              assert ident0['root_digests'][rid]==local['roots'][rid]['stateDigest']
          with urllib.request.urlopen(rd['endpoint']+'/identity',timeout=8) as r:ident=json.load(r)
          assert ident['node_id']==ident0['node_id']
          assert ident['resident_graph_digest']==local['graph_digest']
          (p/'public.pem').write_text(ident['public_key_pem'])
          challenge='FABRIC-'+secrets.token_hex(32)
          payload=json.dumps({'fabric_node_id':'KEX-FABRIC-'+os.environ.get('RUNNER_NAME','SELFHOSTED'),'challenge':challenge,'resident_graph_digest':local['graph_digest']},separators=(',',':')).encode()
          req=urllib.request.Request(rd['endpoint']+'/fabric/join',data=payload,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=10) as r:result=json.load(r)
          receipt=result['receipt']
          assert receipt['challenge']==challenge
          assert receipt['resident_graph_digest']==local['graph_digest']
          raw=json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          (p/'receipt.json').write_bytes(raw)
          (p/'signature.bin').write_bytes(base64.b64decode(result['signature_b64']))
          (p/'result.json').write_text(json.dumps(result,indent=2,sort_keys=True))
          PY
          openssl dgst -sha256 -verify build/join/public.pem -signature build/join/signature.bin build/join/receipt.json | tee build/join/verify.txt
          grep -q 'Verified OK' build/join/verify.txt

      - name: Publish independent fabric readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(sha256sum build/join/receipt.json|awk '{print $1}')
          graph=$(python3 -c "import json;print(json.load(open('build/join/roots.json'))['graph_digest'])")
          node=$(python3 -c "import json;print(json.load(open('build/join/rendezvous.json'))['identity']['node_id'])")
          body="BRAINK_FABRIC_JOINED run_id=${GITHUB_RUN_ID} remote_node=${node} resident_graph=${graph} receipt_sha256=${sha} verifier=${RUNNER_NAME}"
          curl -fsS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${RENDEZVOUS_ISSUE}/comments" \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"body":sys.argv[1]}))' "$body")" >/dev/null
          echo FABRIC_JOIN_VERIFIED

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-braink-fabric-proof-${{ github.sha }}
          path: build/join/
          if-no-files-found: error
