name: KEDDEH V98 Mirror Host Commit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v98_protocol_compliance_config/mirror_update_lane/**'
      - 'v98_protocol_compliance_config/config/mirror_update_lane.json'
      - 'v98_protocol_compliance_config/config/hypervisor_provider_registry.json'
      - 'v98_protocol_compliance_config/src/keddeh_mirror_update_lane.py'
      - 'v98_protocol_compliance_config/src/keddeh_hypervisor_provider_resolver.py'
      - '.github/workflows/v98-mirror-host-commit.yml'

permissions:
  contents: read
  actions: read

jobs:
  hypervisor-mirror-commit:
    name: Hypervisor-routed mirror commit and readback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve provider and execute mirror lane
        run: |
          cd v98_protocol_compliance_config
          python3 -m compileall src tests
          python3 src/keddeh_hypervisor_provider_resolver.py \
            --root . \
            --workload workload://mirror/commit-readback \
            --emit-receipt
          python3 src/keddeh_mirror_update_lane.py --root . --emit-receipt
          python3 -m unittest tests.test_mirror_update_lane -v
      - name: Upload mirror and provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keddeh-v98-hypervisor-mirror-commit
          path: |
            v98_protocol_compliance_config/evidence/
            v98_protocol_compliance_config/runtime_volume/
            v98_protocol_compliance_config/exports/

  m3-target-extension:
    name: Optional M3 mirror target-host extension
    if: vars.KEDDEH_M3_AVAILABLE == 'true'
    runs-on: [self-hosted, macOS, ARM64, KEDDEH-M3]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Capture Apple target-host mirror receipt
        run: |
          cd v98_protocol_compliance_config
          python3 src/keddeh_mirror_update_lane.py --root . --emit-receipt
          python3 src/keddeh_target_host_receipts.py --root . --emit-receipt
      - name: Upload M3 extension evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keddeh-v98-m3-mirror-extension
          path: v98_protocol_compliance_config/evidence/
