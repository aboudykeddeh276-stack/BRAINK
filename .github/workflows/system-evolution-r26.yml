name: BRAINK System Evolution R26
on:
  push:
    paths: ['system-evolution/**']
  pull_request:
    paths: ['system-evolution/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q system-evolution/tests/test_control_plane.py
      - run: python -m compileall -q system-evolution/CONTROL_PLANE_R1.py
