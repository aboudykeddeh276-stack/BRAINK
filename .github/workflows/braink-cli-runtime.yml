name: BRAINK CLI Runtime

on:
  pull_request:
    branches: [main]
  push:
    branches: [braink-cli-runtime-20260714]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-braink-stack:
    name: Execute BRAINK CLI and native stack
    runs-on: ubuntu-latest
    env:
      BRAINK_BRANCH: braink-cli-runtime-20260714
    steps:
      - name: Clone the BRAINK execution branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$BRAINK_BRANCH" \
            "https://github.com/${GITHUB_REPOSITORY}.git" braink
          cd braink
          echo "BRAINK_REPO=$PWD" >> "$GITHUB_ENV"
          echo "BRAINK_HEAD=$(git rev-parse --short HEAD)" | tee "$GITHUB_STEP_SUMMARY"

      - name: Execute BRAINK runtime surfaces
        shell: bash
        run: |
          set +e
          cd "$BRAINK_REPO"
          mkdir -p reports/ci

          run_lane() {
            local lane="$1"
            shift
            echo
            echo "========== ${lane} =========="
            "$@" 2>&1 | tee "reports/ci/${lane}.log"
            local rc=${PIPESTATUS[0]}
            echo "${lane}_RC=${rc}" | tee -a reports/ci/exit-codes.txt
            return ${rc}
          }

          run_lane braink-cli-status python3 scripts/braink-agent-cli.py status
          CLI_STATUS_RC=$?

          run_lane braink-cli-scan python3 scripts/braink-agent-cli.py scan --repo-root .
          CLI_SCAN_RC=$?

          run_lane governance-validation python3 scripts/validate-governance.py
          GOVERNANCE_RC=$?

          run_lane braink-cli-compile python3 -m py_compile scripts/braink-agent-cli.py scripts/validate-governance.py
          CLI_COMPILE_RC=$?

          run_lane self-sustain-compile python3 -m py_compile tools/kex_self_sustain.py tools/kex_ethics_check.py
          SELF_COMPILE_RC=$?

          if [ "$SELF_COMPILE_RC" -eq 0 ]; then
            run_lane self-sustain-generate python3 tools/kex_self_sustain.py \
              --root . \
              --output-dir reports/ci \
              --generated-at 2026-07-14T00:00:00+00:00
            SELF_GENERATE_RC=$?

            if [ -f reports/ci/BRAINK_kex_self_sustain_packet.json ]; then
              run_lane self-sustain-verify python3 tools/kex_self_sustain.py \
                --root . \
                --verify-packet reports/ci/BRAINK_kex_self_sustain_packet.json
              SELF_VERIFY_RC=$?
            else
              echo "self-sustain packet was not generated" | tee reports/ci/self-sustain-verify.log
              SELF_VERIFY_RC=1
            fi
          else
            SELF_GENERATE_RC=1
            SELF_VERIFY_RC=1
          fi

          run_lane ethics-gate python3 tools/kex_ethics_check.py \
            --root . \
            --output reports/ci/kex_ethics_check.json
          ETHICS_RC=$?

          run_lane swift-version swift --version
          SWIFT_RC=$?

          if [ "$SWIFT_RC" -eq 0 ]; then
            run_lane native-runtime-smoke bash NativeChatBot/run-runtime-smoke.command
            SMOKE_RC=$?
          else
            SMOKE_RC=1
          fi

          {
            echo "# BRAINK runtime execution receipt"
            echo
            echo "- CLI status: $CLI_STATUS_RC"
            echo "- CLI scan: $CLI_SCAN_RC"
            echo "- Governance validation: $GOVERNANCE_RC"
            echo "- CLI compilation: $CLI_COMPILE_RC"
            echo "- Self-sustain compilation: $SELF_COMPILE_RC"
            echo "- Self-sustain generation: $SELF_GENERATE_RC"
            echo "- Self-sustain verification: $SELF_VERIFY_RC"
            echo "- Ethics gate: $ETHICS_RC"
            echo "- Swift toolchain: $SWIFT_RC"
            echo "- Native runtime smoke: $SMOKE_RC"
          } | tee reports/ci/runtime-receipt.md >> "$GITHUB_STEP_SUMMARY"

          CORE_FAILURE=$((CLI_STATUS_RC | CLI_SCAN_RC | GOVERNANCE_RC | CLI_COMPILE_RC))
          STACK_FAILURE=$((SELF_COMPILE_RC | SELF_GENERATE_RC | SELF_VERIFY_RC | ETHICS_RC | SWIFT_RC | SMOKE_RC))

          echo "CORE_FAILURE=$CORE_FAILURE"
          echo "STACK_FAILURE=$STACK_FAILURE"

          if [ "$CORE_FAILURE" -ne 0 ] || [ "$STACK_FAILURE" -ne 0 ]; then
            exit 1
          fi
