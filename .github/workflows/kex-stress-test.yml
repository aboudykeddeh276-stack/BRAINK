name: KEX Stress Test

on:
  workflow_dispatch:
    inputs:
      strict_unresolved: {description: "Fail when required runtime implementation surfaces are absent", required: false, default: true, type: boolean}
  repository_dispatch: {types: [kex-runtime-full-validation]}
  push:
    branches: [main]
    paths: [".kex/**", "scripts/kex-ci/**", ".github/workflows/kex-*.yml", "kex/**", "modules/**", "deploy/**"]
permissions: {contents: read}
jobs:
  runtime-validation:
    runs-on: [self-hosted, kex, stress, telemetry, performance]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: |
          STRICT=""; if [ "${{ inputs.strict_unresolved }}" = "true" ]; then STRICT="--strict-unresolved"; fi
          python3 scripts/kex-ci/validate_control_plane.py --mode stress $STRICT
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: "kex-stress-${{ github.run_id }}-runtime", path: "reports/kex-ci/stress.json"}
