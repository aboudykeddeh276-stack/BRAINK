name: BRAINK Recursive Computer R26

on:
  push:
    paths:
      - 'enterprise/recursive_computer_runtime_r26.py'
      - 'enterprise/self_addressing_runtime.py'
      - 'enterprise/continuation_runtime.py'
      - 'enterprise/substrate_adapters.py'
      - 'enterprise/auto_binder.py'
      - 'runtime/R25/system_evolution_runtime.py'
      - 'tests/R26/**'
      - '.github/workflows/recursive-computer-r26.yml'
  pull_request:
    paths:
      - 'enterprise/recursive_computer_runtime_r26.py'
      - 'enterprise/self_addressing_runtime.py'
      - 'enterprise/continuation_runtime.py'
      - 'enterprise/substrate_adapters.py'
      - 'enterprise/auto_binder.py'
      - 'runtime/R25/system_evolution_runtime.py'
      - 'tests/R26/**'
      - '.github/workflows/recursive-computer-r26.yml'

permissions:
  contents: read

jobs:
  recursive-proof:
    runs-on:
      - self-hosted
      - kex
      - cascade
      - hyperk0
      - warmboot
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python carrier
        run: python3 --version
      - name: Execute recursive constructor proof
        run: python3 -m pytest -q tests/R26/test_recursive_computer_runtime_r26.py
      - name: Compile runtime lineage
        run: python3 -m compileall -q enterprise/recursive_computer_runtime_r26.py enterprise/self_addressing_runtime.py enterprise/continuation_runtime.py enterprise/substrate_adapters.py enterprise/auto_binder.py runtime/R25/system_evolution_runtime.py
