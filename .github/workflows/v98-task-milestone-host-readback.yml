name: KEDDEH V98 Task Milestone Host Readback

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v98_protocol_compliance_config/config/task_milestone_registry.json'
      - 'v98_protocol_compliance_config/src/keddeh_task_milestone_monitor.py'
      - '.github/workflows/v98-task-milestone-host-readback.yml'

permissions:
  contents: read
  actions: read

jobs:
  m3-task-readback:
    name: M3 task receipt and environment readback
    runs-on: [self-hosted, macOS, ARM64, KEDDEH-M3]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reconstruct task state on target host
        run: |
          cd v98_protocol_compliance_config
          python3 -m compileall src tests
          python3 src/keddeh_task_milestone_monitor.py --root . --emit-receipt
      - name: Capture target-host receipts
        run: |
          cd v98_protocol_compliance_config
          python3 src/keddeh_target_host_receipts.py --root . --emit-receipt
      - name: Run reintegration tests
        run: |
          cd v98_protocol_compliance_config
          python3 src/keddeh_test_runner.py --root . --emit-receipt
      - name: Upload target-host task evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keddeh-v98-m3-task-readback-evidence
          path: |
            v98_protocol_compliance_config/evidence/
            v98_protocol_compliance_config/runtime_volume/
            v98_protocol_compliance_config/exports/
