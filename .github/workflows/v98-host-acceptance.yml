name: KEDDEH V98 Host Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v98_protocol_compliance_config/**'
      - '.github/workflows/v98-host-acceptance.yml'

permissions:
  contents: read
  actions: read

jobs:
  host-acceptance:
    name: self-hosted M3 protocol compliance acceptance
    runs-on: [self-hosted, macOS, ARM64, KEDDEH-M3]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Run V98 acceptance harness
        run: |
          cd v98_protocol_compliance_config
          python3 -m compileall src tests
          python3 src/keddeh_v98_acceptance_harness.py --root . --emit-receipt
          python3 -m unittest discover -s tests -v
      - name: Upload local evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: keddeh-v98-evidence
          path: |
            v98_protocol_compliance_config/evidence/
            v98_protocol_compliance_config/runtime_volume/
            v98_protocol_compliance_config/exports/
