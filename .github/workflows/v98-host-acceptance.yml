name: KEDDEH V98 Host Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v98_protocol_compliance_config/**'
      - '.github/workflows/v98-host-acceptance.yml'
      - '.github/workflows/v98-mirror-update-lane.yml'
      - '.github/workflows/v98-workflow-schema-guard.yml'
      - '.github/workflows/v98-design-deployment-workflow.yml'
      - '.github/workflows/v98-dependency-failure-isolation.yml'
      - '.github/workflows/v98-k-cloud-deploy.yml'
      - '.github/workflows/v98-application-applet-shipping.yml'
      - '.github/workflows/v98-deployment-maturity-workplan.yml'
      - '.github/workflows/v98-current-state-surface-audit.yml'
      - '.github/workflows/v99-evidence-context-resolution.yml'

permissions:
  contents: read
  actions: read

jobs:
  host-acceptance:
    name: self-hosted M3 protocol compliance acceptance
    runs-on: [self-hosted, macOS, ARM64, KEDDEH-M3]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Compile executable modules
        run: |
          cd v98_protocol_compliance_config
          python3 -m compileall src tests
      - name: Install and load launchd service spine
        run: |
          cd v98_protocol_compliance_config
          bash scripts/install.command
      - name: Capture executable target-host receipts without global coupling
        run: |
          cd v98_protocol_compliance_config
          python3 src/keddeh_target_host_receipts.py --root . --emit-receipt || true
          python3 src/keddeh_dependency_failure_orchestrator.py --root . --emit-receipt
      - name: Execute K-Cloud package integrity and deployment adapter
        if: always()
        run: |
          cd v98_protocol_compliance_config
          python3 src/keddeh_k_cloud_adapter.py --root . --emit-receipt
      - name: Package every applet and application as K-APP
        if: always()
        run: |
          cd v98_protocol_compliance_config
          python3 src/keddeh_application_applet_packager.py --root . --emit-receipt
      - name: Produce deployment maturity workplan
        if: always()
        run: |
          cd v98_protocol_compliance_config
          python3 src/keddeh_deployment_maturity_workplan.py --root . --emit-receipt
      - name: Audit current desktop, emulator, server and hardware surfaces
        if: always()
        run: |
          cd v98_protocol_compliance_config
          python3 src/keddeh_current_state_surface_auditor.py --root . --emit-receipt
      - name: Resolve contextual evidence state
        if: always()
        run: |
          cd v98_protocol_compliance_config
          python3 src/keddeh_evidence_context_resolver.py --root . --emit-receipt
      - name: Execute acceptance, BTC router, task, workflow and design deployment gates
        if: always()
        run: |
          cd v98_protocol_compliance_config
          python3 src/keddeh_v98_acceptance_harness.py --root . --emit-receipt
          python3 src/keddeh_btc_core_protocol_router.py --root . --once --emit-receipt
          python3 src/keddeh_task_milestone_monitor.py --root . --emit-receipt
          python3 src/keddeh_workflow_schema_guard.py --root . --emit-receipt
          python3 src/keddeh_design_deployment_workflow.py --root . --emit-receipt
      - name: Run TestCase tests
        if: always()
        run: |
          cd v98_protocol_compliance_config
          python3 -m unittest discover -s tests -v 2>&1 | tee unittest.log
          grep -Eq '^Ran [1-9][0-9]* tests? in ' unittest.log
      - name: Run plain function tests
        if: always()
        run: |
          cd v98_protocol_compliance_config
          python3 src/keddeh_test_runner.py --root . --emit-receipt 2>&1 | tee test_runner.log
          grep -Eq '"tests_executed": [1-9][0-9]*' test_runner.log
      - name: Upload local evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keddeh-v98-evidence
          path: |
            v98_protocol_compliance_config/evidence/
            v98_protocol_compliance_config/runtime_volume/
            v98_protocol_compliance_config/exports/
            v98_protocol_compliance_config/unittest.log
            v98_protocol_compliance_config/test_runner.log
