name: BRAINK Enterprise Capability R7

on:
  push:
    branches: [ main ]
    paths:
      - 'mcp/braink_process_adapter/**'
      - 'scripts/kex-ci/test_enterprise_capability_runtime_r6.py'
      - 'scripts/kex-ci/test_mcp_governance_surface_r6.py'
      - 'scripts/kex-ci/test_agent_authority_actual_process_r6.py'
      - 'scripts/kex-ci/test_agent_function_contracts_r7.py'
      - '.github/workflows/braink-enterprise-capability-r6.yml'
  pull_request:
    paths:
      - 'mcp/braink_process_adapter/**'
      - 'scripts/kex-ci/test_enterprise_capability_runtime_r6.py'
      - 'scripts/kex-ci/test_mcp_governance_surface_r6.py'
      - 'scripts/kex-ci/test_agent_authority_actual_process_r6.py'
      - 'scripts/kex-ci/test_agent_function_contracts_r7.py'
      - '.github/workflows/braink-enterprise-capability-r6.yml'

permissions:
  contents: read

jobs:
  enterprise-capability-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile governed capability modules
        run: |
          python -m py_compile \
            mcp/braink_process_adapter/capability_runtime.py \
            mcp/braink_process_adapter/capability_catalog.py \
            mcp/braink_process_adapter/function_contracts.py \
            mcp/braink_process_adapter/agent_authority_client.py \
            mcp/braink_process_adapter/backend.py \
            mcp/braink_process_adapter/sector_bridges.py \
            mcp/braink_process_adapter/main.py
      - name: Enterprise capability controls
        run: python scripts/kex-ci/test_enterprise_capability_runtime_r6.py
      - name: MCP mutation bypass guard
        run: python scripts/kex-ci/test_mcp_governance_surface_r6.py
      - name: Agent authority actual-process qualification
        run: python scripts/kex-ci/test_agent_authority_actual_process_r6.py
      - name: Typed agent function contracts
        run: python scripts/kex-ci/test_agent_function_contracts_r7.py
