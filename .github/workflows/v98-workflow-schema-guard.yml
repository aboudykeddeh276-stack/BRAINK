name: KEDDEH V98 Workflow Schema Guard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v98_protocol_compliance_config/config/workflow_schema.json'
      - 'v98_protocol_compliance_config/src/keddeh_workflow_schema_guard.py'
      - 'v98_protocol_compliance_config/tests/test_workflow_schema_guard.py'
      - 'v98_protocol_compliance_config/docs/WORKFLOW_SCHEMA_STANDARD.md'
      - 'v98_protocol_compliance_config/scripts/workflow_schema.command'
      - '.github/workflows/v98-workflow-schema-guard.yml'

permissions:
  contents: read
  actions: read

jobs:
  workflow-schema-guard:
    name: workflow schema guard receipt path
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run workflow schema guard
        run: |
          cd v98_protocol_compliance_config
          python3 -m compileall src tests
          python3 src/keddeh_workflow_schema_guard.py --root . --emit-receipt
          python3 -m unittest tests.test_workflow_schema_guard -v
      - name: Upload workflow schema evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: keddeh-v98-workflow-schema-evidence
          path: |
            v98_protocol_compliance_config/evidence/workflow_schema_guard_receipt.json
            v98_protocol_compliance_config/runtime_volume/
            v98_protocol_compliance_config/exports/workflow_schema_guard_matrix.csv
