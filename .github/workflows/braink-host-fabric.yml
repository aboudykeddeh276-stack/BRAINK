name: BRAINK Host Fabric

on:
  push:
    paths:
      - 'runtime/host_control/**'
      - 'integrations/desktop_commander/**'
      - '.kex/runner-control-plane.json'
      - '.github/workflows/braink-host-fabric.yml'
  pull_request:
    paths:
      - 'runtime/host_control/**'
      - 'integrations/desktop_commander/**'
      - '.kex/runner-control-plane.json'

jobs:
  validate-host-fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministic validation with captured diagnostics
        id: validation
        shell: bash
        run: |
          set +e
          : > host-fabric-diagnostics.txt
          run_check() {
            name="$1"; shift
            echo "===== ${name} =====" | tee -a host-fabric-diagnostics.txt
            "$@" 2>&1 | tee -a host-fabric-diagnostics.txt
            rc=${PIPESTATUS[0]}
            echo "RC=${rc}" | tee -a host-fabric-diagnostics.txt
            if [ "$rc" -ne 0 ]; then
              echo "FAILED_CHECK=${name}" | tee -a host-fabric-diagnostics.txt
              return "$rc"
            fi
          }
          rc=0
          run_check compile_registry python -m py_compile runtime/runtime_registry.py || rc=$?
          [ "$rc" -eq 0 ] && run_check compile_dc python -m py_compile runtime/host_control/braink_desktop_commander_runtime.py || rc=$?
          [ "$rc" -eq 0 ] && run_check compile_fabric python -m py_compile runtime/host_control/braink_host_fabric.py || rc=$?
          [ "$rc" -eq 0 ] && run_check compile_activation python -m py_compile runtime/host_control/braink_host_activation.py || rc=$?
          [ "$rc" -eq 0 ] && run_check fabric_self_test python -m runtime.host_control.braink_host_fabric --self-test || rc=$?
          [ "$rc" -eq 0 ] && run_check activation_self_test python -m runtime.host_control.braink_host_activation --self-test || rc=$?
          [ "$rc" -eq 0 ] && run_check control_plane_json python -m json.tool .kex/runner-control-plane.json || rc=$?
          [ "$rc" -eq 0 ] && run_check dc_bundle_json python -m json.tool integrations/desktop_commander/BRAINK_DESKTOP_COMMANDER_BUNDLE_R1.json || rc=$?
          echo "FINAL_RC=${rc}" | tee -a host-fabric-diagnostics.txt
          exit "$rc"
      - name: Upload host-fabric diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-fabric-diagnostics
          path: host-fabric-diagnostics.txt
          if-no-files-found: error
