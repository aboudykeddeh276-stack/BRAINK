name: KEX OpenAPI Validation

on:
  workflow_dispatch:
    inputs:
      use_self_hosted:
        description: "Also execute on the specialist self-hosted KEX runner"
        required: false
        default: false
        type: boolean
      strict_unresolved:
        description: "Fail when required runtime implementation surfaces are absent"
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types: [kex-runtime-full-validation]
  push:
    branches: [main]
    paths:
      - "openapi/**"
      - "modules/kex_wbos/**"
      - "scripts/kex-ci/**"
      - ".kex/**"
      - ".github/workflows/kex-*.yml"

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook runtime dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Exercise Unified WBOS API and proof ledger
        run: python scripts/kex-ci/test_wbos_api.py
      - name: Exercise Unified Action Runtime mutation semantics
        run: python scripts/kex-ci/test_action_runtime.py
      - name: Validate KEX repository surface
        run: python scripts/kex-ci/validate_control_plane.py --mode openapi
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kex-openapi-${{ github.run_id }}-control
          path: |
            reports/kex-ci/openapi.json
            reports/kex-wbos/integration.json
            reports/kex-wbos/action-runtime-integration.json
            reports/kex-wbos/proof-ledger.jsonl
            reports/kex-wbos/action-ledger.jsonl
            reports/kex-wbos/action-proof-ledger.jsonl
          if-no-files-found: warn

  specialist:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_self_hosted }}
    runs-on: [self-hosted, kex, api, fastapi, openapi]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install workbook runtime dependency
        run: python3 -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Exercise Unified WBOS API
        run: python3 scripts/kex-ci/test_wbos_api.py
      - name: Exercise Unified Action Runtime
        run: python3 scripts/kex-ci/test_action_runtime.py
      - name: Validate specialist surface
        run: |
          STRICT=""
          if [ "${{ inputs.strict_unresolved }}" = "true" ]; then STRICT="--strict-unresolved"; fi
          python3 scripts/kex-ci/validate_control_plane.py --mode openapi $STRICT
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kex-openapi-${{ github.run_id }}-specialist
          path: |
            reports/kex-ci/openapi.json
            reports/kex-wbos/integration.json
            reports/kex-wbos/action-runtime-integration.json
            reports/kex-wbos/proof-ledger.jsonl
            reports/kex-wbos/action-ledger.jsonl
            reports/kex-wbos/action-proof-ledger.jsonl
          if-no-files-found: warn
