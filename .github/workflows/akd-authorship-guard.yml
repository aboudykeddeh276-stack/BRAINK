name: AKD Authorship Guard

on:
  push:
    branches: [main]
    paths:
      - 'enterprise/**'
      - 'deployment/**'
      - 'scripts/kex-ci/test_authorship_guard.py'
      - 'scripts/kex-ci/test_authorship_audit_r26.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate AKD authorship guard
        run: python scripts/kex-ci/test_authorship_guard.py
      - name: Audit deployment lineage and fail on orphaned AKD services
        run: python scripts/kex-ci/test_authorship_audit_r26.py
