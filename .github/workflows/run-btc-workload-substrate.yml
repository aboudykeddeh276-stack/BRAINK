name: BRAINK BTC Workload Substrate

on:
  push:
    branches:
      - run/btc-workload-substrate-20260724
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-btc-workload-substrate.yml
      - runtime/btc_workload_substrate.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch BRAINK substrate revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init braink
          cd braink
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Execute BTC workload function in BRAINK
        env:
          BTC_NETWORK: mainnet
          KEX_ALLOW_LIVE_SUBMIT: "0"
          KEX_BTC_STATE_DIR: ${{ github.workspace }}/braink/state/kex_btc
        run: |
          set -o pipefail
          python3 braink/runtime/btc_workload_substrate.py 2>&1 | tee braink_btc_workload_output.json

      - name: Print retained execution result
        if: always()
        run: |
          if [ -f braink_btc_workload_output.json ]; then
            cat braink_btc_workload_output.json
          else
            echo '{"execution_started":false,"reason":"no output file produced"}'
            exit 1
          fi
