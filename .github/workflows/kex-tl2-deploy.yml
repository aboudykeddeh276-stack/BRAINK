name: KEX TL2 Deploy

on:
  push:
    branches: [main]
    paths:
      - "deploy/tl2_deploy.py"
      - "deploy/KEX_TL2_DEPLOYMENT_ROUTE_R1.json"
      - "modules/kex_wbos/**"
      - "scripts/kex-ci/exercise_capability_fabric.py"
      - "scripts/kex-ci/reconcile_tl2_capability.py"
      - ".github/workflows/kex-tl2-deploy.yml"
  workflow_dispatch:
    inputs:
      leave_resident:
        description: "Leave verified services resident on the TL2 host"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy-tl2:
    runs-on: [self-hosted, kex, tl2]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook runtime dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Exercise local KEX capability fabric
        run: python scripts/kex-ci/exercise_capability_fabric.py
      - name: Observe TL2 identity and deploy supervised action server
        env:
          KEX_TL2_ADDRESS: ${{ vars.KEX_TL2_ADDRESS }}
          KEX_BEARER_TOKEN: ${{ secrets.KEX_BEARER_TOKEN }}
        run: |
          FLAGS="--daemon"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.leave_resident }}" != "true" ]; then FLAGS=""; fi
          python deploy/tl2_deploy.py $FLAGS
      - name: Require TL2_LIVE receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/kex-wbos/tl2-deployment.json').read_text())
          assert r['status']=='VERIFIED', r
          assert r['promotion']=='TL2_LIVE', r
          assert all(x['ok'] for x in r['readback']), r
          assert r['public_promotions']==['NOT_CLAIMED'], r
          print(json.dumps(r, indent=2))
          PY
      - name: Reconcile staged capability intent with TL2 participant receipt
        run: python scripts/kex-ci/reconcile_tl2_capability.py
      - name: Upload TL2 capability and deployment receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kex-tl2-capability-${{ github.run_id }}
          path: |
            reports/kex-wbos/capability-fabric/*.json
            reports/kex-wbos/tl2-deployment.json
            reports/kex-wbos/tl2-capability-reconciliation.json
            reports/kex-wbos/tl2-proof-ledger.jsonl
            reports/kex-wbos/proof-ledger.jsonl
            reports/kex-wbos/action-ledger-v2.jsonl
            runtime/checkpoints/*.json
          if-no-files-found: warn
