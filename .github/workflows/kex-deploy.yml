name: KEX Deploy

on:
  workflow_dispatch:
    inputs:
      use_self_hosted: {description: "Also execute on the specialist self-hosted KEX runner", required: false, default: false, type: boolean}
      strict_unresolved: {description: "Fail when required runtime implementation surfaces are absent", required: false, default: true, type: boolean}
  repository_dispatch: {types: [kex-runtime-full-validation]}
  push:
    branches: [main]
    paths: [".kex/**", "scripts/kex-ci/**", ".github/workflows/kex-*.yml", "kex/**", "modules/**", "deploy/**"]
permissions: {contents: read}
jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/kex-ci/validate_control_plane.py --mode deploy
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: "kex-deploy-${{ github.run_id }}-control", path: "reports/kex-ci/deploy.json"}
  specialist:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_self_hosted }}
    runs-on: [self-hosted, kex, deploy, docker, release]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: |
          STRICT=""; if [ "${{ inputs.strict_unresolved }}" = "true" ]; then STRICT="--strict-unresolved"; fi
          python3 scripts/kex-ci/validate_control_plane.py --mode deploy $STRICT
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: "kex-deploy-${{ github.run_id }}-specialist", path: "reports/kex-ci/deploy.json"}
