name: Current Main Recursive Dependency Reconciliation

on:
  push:
    branches:
      - reconcile/current-main-unification-r1
    paths:
      - 'enterprise/continuation_runtime.py'
      - 'enterprise/substrate_adapters.py'
      - 'enterprise/self_addressing_runtime.py'
      - 'enterprise/recursive_computer_runtime_r26.py'
      - 'enterprise/state_ledger_atomicity_r31.py'
      - 'runtime/R25/system_evolution_runtime.py'
      - 'tests/R26/**'
      - 'tests/R31/**'
      - '.github/workflows/current-main-recursive-dependency-reconciliation.yml'
  pull_request:
    paths:
      - 'enterprise/continuation_runtime.py'
      - 'enterprise/substrate_adapters.py'
      - 'enterprise/self_addressing_runtime.py'
      - 'enterprise/recursive_computer_runtime_r26.py'
      - 'enterprise/state_ledger_atomicity_r31.py'
      - 'runtime/R25/system_evolution_runtime.py'
      - 'tests/R26/**'
      - 'tests/R31/**'
      - '.github/workflows/current-main-recursive-dependency-reconciliation.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on:
      - self-hosted
      - kex
      - cascade
      - hyperk0
      - warmboot
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify resident runtime dependencies
        run: |
          python3 --version
          python3 -c "import fcntl, sqlite3, hashlib, json; print('stdlib-runtime-dependencies: PASS')"
          python3 -c "import pytest; print('pytest:', pytest.__version__)"
      - name: Compile reconciled dependency chain
        run: |
          python3 -m py_compile \
            enterprise/continuation_runtime.py \
            enterprise/substrate_adapters.py \
            enterprise/self_addressing_runtime.py \
            runtime/R25/system_evolution_runtime.py \
            enterprise/recursive_computer_runtime_r26.py \
            enterprise/state_ledger_atomicity_r31.py
      - name: Recursive computer core
        run: python3 -m pytest -q tests/R26/test_recursive_computer_runtime_r26.py
      - name: Process adversarial persistence
        run: python3 -m pytest -q tests/R26/test_recursive_process_adversarial_r26.py
      - name: Ledger integrity
        run: python3 -m pytest -q tests/R26/test_ledger_integrity_r30.py
      - name: State-ledger atomicity
        run: python3 -m pytest -q tests/R31/test_state_ledger_atomicity_r31.py
