name: Current Main Recursive Dependency Reconciliation

on:
  push:
    branches:
      - reconcile/current-main-unification-r1
    paths:
      - 'enterprise/**'
      - 'runtime/**'
      - 'modules/kex_core/**'
      - 'dependency-graph/**'
      - 'scripts/dependency_graph/**'
      - 'governance/system_interface_inventory_r1.json'
      - 'tests/R26/**'
      - 'tests/R31/**'
      - 'tests/integration/**'
      - '.github/workflows/current-main-recursive-dependency-reconciliation.yml'
  pull_request:
    paths:
      - 'enterprise/**'
      - 'runtime/**'
      - 'modules/kex_core/**'
      - 'dependency-graph/**'
      - 'scripts/dependency_graph/**'
      - 'governance/system_interface_inventory_r1.json'
      - 'tests/R26/**'
      - 'tests/R31/**'
      - 'tests/integration/**'
      - '.github/workflows/current-main-recursive-dependency-reconciliation.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on:
      - self-hosted
      - kex
      - cascade
      - hyperk0
      - warmboot
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: BRAINK
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: aboudykeddeh276-stack/SERVERS-KEDDEHSYSTEMS
          path: BRAINK/dependencies/SERVERS-KEDDEHSYSTEMS

      - name: Detect dependency graph before admission
        working-directory: BRAINK
        run: |
          python3 scripts/dependency_graph/braink_dependency_detector.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          graph = json.loads(Path('build/braink-semantic-dependency-graph.json').read_text())
          required = {'MODULE_DEPENDENCY','REPOSITORY_DEPENDENCY','RUNTIME_AUTHORITY_DEPENDENCY'}
          observed = set(graph['summary']['by_class'])
          missing = required - observed
          if missing:
              raise SystemExit(f'DEPENDENCY_GRAPH_INCOMPLETE:{sorted(missing)}')
          print('dependency-graph-admission: PASS', graph['summary'])
          PY

      - name: Resolve resident BRAINK KEX roots before carrier tests
        working-directory: BRAINK
        run: |
          python3 enterprise/resident_root_runtime.py --root . --output build/resident-root-graph.json
          python3 - <<'PY'
          import json
          g=json.load(open('build/resident-root-graph.json'))
          required=('BRAINK_ROOT','DOMAIN_ROOT','DNS_ROOT','REGISTRAR_ROOT','TLS_ROOT','SERVER_ROOT','CLOUD_ROOT')
          for rid in required:
              assert g['roots'][rid]['payload']['state']=='BOUND', (rid,g['roots'][rid]['payload']['state'])
              assert g['roots'][rid]['payload']['implementation_exists'] is True, rid
          print('resident-root-admission: PASS', g['graph_digest'])
          PY

      - name: Verify resident runtime dependencies
        working-directory: BRAINK
        run: |
          python3 --version
          openssl version
          python3 -c "import fcntl, sqlite3, hashlib, json, socket, struct, ssl; print('stdlib-runtime-dependencies: PASS')"
          python3 -c "import pytest; print('pytest:', pytest.__version__)"
          test -f dependencies/SERVERS-KEDDEHSYSTEMS/runtime/domain_authority/kex_registrar_service.py
          test -f dependencies/SERVERS-KEDDEHSYSTEMS/runtime/domain_authority/kex_dns.py
          test -f enterprise/tls_authority_runtime.py

      - name: Compile reconciled dependency chain
        working-directory: BRAINK
        run: |
          python3 -m py_compile \
            modules/kex_core/canonical_state.py \
            enterprise/resident_root_runtime.py \
            enterprise/remote_fabric_node.py \
            enterprise/tls_authority_runtime.py \
            enterprise/continuation_runtime.py \
            enterprise/substrate_adapters.py \
            enterprise/self_addressing_runtime.py \
            enterprise/recursive_commit_coordinator_r31.py \
            runtime/R25/system_evolution_runtime.py \
            enterprise/recursive_computer_runtime_r26.py \
            enterprise/state_ledger_atomicity_r31.py \
            enterprise/domain_authority_binding.py \
            scripts/dependency_graph/braink_dependency_detector.py

      - name: Resident root authority and carrier invariance
        working-directory: BRAINK
        run: python3 -m pytest -q tests/integration/test_resident_root_runtime.py
      - name: Resident TLS authority, renewal, readback and handshake
        working-directory: BRAINK
        run: python3 -m pytest -q tests/integration/test_tls_authority_runtime.py
      - name: Recursive computer core
        working-directory: BRAINK
        run: python3 -m pytest -q tests/R26/test_recursive_computer_runtime_r26.py
      - name: Process adversarial persistence
        working-directory: BRAINK
        run: python3 -m pytest -q tests/R26/test_recursive_process_adversarial_r26.py
      - name: Ledger integrity
        working-directory: BRAINK
        run: python3 -m pytest -q tests/R26/test_ledger_integrity_r30.py
      - name: Generic state-ledger atomicity primitive
        working-directory: BRAINK
        run: python3 -m pytest -q tests/R31/test_state_ledger_atomicity_r31.py
      - name: Native recursive state-ledger crash recovery
        working-directory: BRAINK
        run: python3 -m pytest -q tests/R31/test_recursive_native_atomicity_r31.py
      - name: Domain authority UDP and TCP integration
        working-directory: BRAINK
        run: python3 -m pytest -q tests/integration/test_domain_authority_binding.py
