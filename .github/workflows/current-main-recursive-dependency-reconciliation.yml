name: Current Main Recursive Dependency Reconciliation

on:
  push:
    branches:
      - reconcile/current-main-unification-r1
    paths:
      - 'enterprise/continuation_runtime.py'
      - 'enterprise/substrate_adapters.py'
      - 'enterprise/self_addressing_runtime.py'
      - 'enterprise/recursive_computer_runtime_r26.py'
      - 'enterprise/state_ledger_atomicity_r31.py'
      - 'runtime/R25/system_evolution_runtime.py'
      - 'tests/R26/**'
      - 'tests/R31/**'
      - '.github/workflows/current-main-recursive-dependency-reconciliation.yml'
  pull_request:
    paths:
      - 'enterprise/continuation_runtime.py'
      - 'enterprise/substrate_adapters.py'
      - 'enterprise/self_addressing_runtime.py'
      - 'enterprise/recursive_computer_runtime_r26.py'
      - 'enterprise/state_ledger_atomicity_r31.py'
      - 'runtime/R25/system_evolution_runtime.py'
      - 'tests/R26/**'
      - 'tests/R31/**'
      - '.github/workflows/current-main-recursive-dependency-reconciliation.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install qualification dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile reconciled dependency chain
        run: |
          python -m py_compile \
            enterprise/continuation_runtime.py \
            enterprise/substrate_adapters.py \
            enterprise/self_addressing_runtime.py \
            runtime/R25/system_evolution_runtime.py \
            enterprise/recursive_computer_runtime_r26.py \
            enterprise/state_ledger_atomicity_r31.py
      - name: Recursive computer core
        run: python -m pytest -q tests/R26/test_recursive_computer_runtime_r26.py
      - name: Process adversarial persistence
        run: python -m pytest -q tests/R26/test_recursive_process_adversarial_r26.py
      - name: Ledger integrity
        run: python -m pytest -q tests/R26/test_ledger_integrity_r30.py
      - name: State-ledger atomicity
        run: python -m pytest -q tests/R31/test_state_ledger_atomicity_r31.py
