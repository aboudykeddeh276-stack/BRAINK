name: V108 Persisted Export Availability

on:
  pull_request:
    paths:
      - 'v98_protocol_compliance_config/src/keddeh_persisted_export_service.py'
      - 'v98_protocol_compliance_config/tests/test_persisted_export_service.py'
      - '.github/workflows/v108-persisted-export-availability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v108-persisted-export-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  persisted-export-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v98_protocol_compliance_config
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile executable source
        run: python3 -m compileall -q src/keddeh_persisted_export_service.py tests/test_persisted_export_service.py

      - name: Execute positive negative failover and recovery tests
        run: python3 -m unittest tests.test_persisted_export_service -v

      - name: Build persisted downloadable proof bundle
        run: |
          mkdir -p \
            runtime_volume/cases/CI-EXPORT-1 \
            runtime_volume/outbox/persisted_exports \
            exports/downloads \
            evidence/exports
          printf '%s\n' '{"case_id":"CI-EXPORT-1","state":"persisted"}' > runtime_volume/cases/CI-EXPORT-1/case-record.json
          printf '%s\n' '# Persisted export proof' 'Executable source readback.' > runtime_volume/cases/CI-EXPORT-1/report.md
          python3 src/keddeh_persisted_export_service.py \
            --root . \
            --export-id CI-EXPORT-1 \
            --attachment-filename CI-EXPORT-1-complete-export.zip \
            runtime_volume/cases/CI-EXPORT-1/case-record.json \
            runtime_volume/cases/CI-EXPORT-1/report.md \
            | tee evidence/persisted_export_cli_readback.json

      - name: Assert receipt ledger outbox and attachment metadata
        run: |
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          root = Path('.')
          receipt = json.loads((root / 'evidence/exports/CI-EXPORT-1.receipt.json').read_text())
          assert receipt['zip_integrity_passed'] is True
          assert receipt['source_byte_readback_passed'] is True
          assert receipt['persisted_storage_passed'] is True
          assert receipt['ledger_readback_passed'] is True
          archive = root / receipt['archive_path']
          assert archive.is_file()
          with zipfile.ZipFile(archive) as bundle:
              assert bundle.testzip() is None
              assert len(json.loads(bundle.read('SHA256-MANIFEST.json'))['sources']) == 2
          outbox = json.loads((root / receipt['outbox_handoff_path']).read_text())
          assert outbox['state'] == 'READY_FOR_DOWNLOAD'
          assert outbox['attachment']['filename'] == 'CI-EXPORT-1-complete-export.zip'
          assert outbox['attachment']['content_type'] == 'application/zip'
          assert outbox['attachment']['content_disposition'] == 'attachment; filename="CI-EXPORT-1-complete-export.zip"'
          ledger = [json.loads(line) for line in (root / 'runtime_volume/proof_bundles.ledger').read_text().splitlines() if line]
          assert any(row.get('export_id') == 'CI-EXPORT-1' and row.get('archive_sha256') == receipt['archive_sha256'] for row in ledger)
          PY

      - name: Upload executable export evidence
        uses: actions/upload-artifact@v4
        with:
          name: v108-persisted-export-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            v98_protocol_compliance_config/exports/downloads/CI-EXPORT-1-complete-export.zip
            v98_protocol_compliance_config/evidence/exports/CI-EXPORT-1.receipt.json
            v98_protocol_compliance_config/evidence/persisted_export_cli_readback.json
            v98_protocol_compliance_config/runtime_volume/proof_bundles.ledger
            v98_protocol_compliance_config/runtime_volume/outbox/persisted_exports/CI-EXPORT-1.handoff.json
