name: KEDDEH Edge Fleet Self-Test

on:
  push:
    branches:
      - kex-keddeh-edge-v1
    paths:
      - 'tools/site-action-platform/keddeh-edge/**'
      - '.github/workflows/keddeh-edge-fleet-self-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fleet-self-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch authored BRAINK successor revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init braink
          cd braink
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Execute published KEDDEH Edge fleet self-test
        shell: bash
        run: |
          set -euo pipefail
          node braink/tools/site-action-platform/keddeh-edge/keddeh-edge-fleet-self-test.mjs | tee KEDDEH_EDGE_FLEET_SELF_TEST_RESULT.json

      - name: Read back typed execution result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f KEDDEH_EDGE_FLEET_SELF_TEST_RESULT.json ]; then
            echo '{"state":"FAIL","failure":"NO_EXECUTION_RECEIPT"}'
            exit 1
          fi
          cat KEDDEH_EDGE_FLEET_SELF_TEST_RESULT.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('KEDDEH_EDGE_FLEET_SELF_TEST_RESULT.json','utf8'));
          if (r.state !== 'PASS') process.exit(1);
          console.log(`KEDDEH_EDGE_FLEET_SELF_TEST_PASS ${r.passed}/${r.total}`);
          NODE
