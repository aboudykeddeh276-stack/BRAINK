name: BRAINK6 Tool Runtime

on:
  push:
    branches: ["feature/braink6-ai-tool-runtime"]
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile runtime and Python adapter
        run: python -m py_compile runtime/braink6_tool.py runtime/braink6_api.py
      - name: Validate plugin and tool manifests
        run: |
          python -m json.tool braink6/plugin.json >/dev/null
          python -m json.tool braink6/tool.schema.json >/dev/null
          test -s braink6/SKILL.md
      - name: Run BRAINK6 conformance
        run: python -m pytest -q tests/test_braink6_tool.py tests/test_braink6_api.py
      - name: Exercise executable tool
        run: |
          python runtime/braink6_tool.py init-task SELF-TEST "BRAINK6 self-test" "Execute a reconstructed capability" --accept receipt --obligation execute
          python runtime/braink6_tool.py define-capability PYTHON-CHECK "Verified Python execution" --dependency python --validator "python -c pass"
          python runtime/braink6_tool.py unlock PYTHON-CHECK
          python runtime/braink6_tool.py run PYTHON-CHECK python -c "print('BRAINK6_EXECUTION_OK')"
          python runtime/braink6_tool.py status
      - name: Exercise importable Python skill
        run: |
          PYTHONPATH=runtime python - <<'PY'
          from pathlib import Path
          from braink6_api import BrainK6Runtime
          r = BrainK6Runtime(Path('.braink6-api-test'))
          r.task('API-SELF-TEST', 'Python API', 'Execute through importable BRAINK6', acceptance=['receipt'])
          r.define_python()
          receipt = r.unlock('PYTHON')
          assert receipt['payload']['capability']['state'] == 'UNLOCKED'
          result = r.run_python("print('BRAINK6_API_OK')")
          assert result['payload']['result']['returncode'] == 0
          assert 'BRAINK6_API_OK' in result['payload']['result']['stdout']
          PY
