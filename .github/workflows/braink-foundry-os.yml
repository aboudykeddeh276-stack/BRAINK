name: BRAINK Foundry OS
on:
  push:
    branches: [main]
    paths:
      - "enterprise/foundry/**"
      - "scripts/kex-ci/test_foundry_os_r1.py"
      - ".github/workflows/braink-foundry-os.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-foundries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Foundry OS
        run: python -m compileall -q enterprise/foundry
      - name: Validate full registry preservation and runnable software
        run: python scripts/kex-ci/test_foundry_os_r1.py
