name: KEDDEH V114 Unified Codebase Runtime

on:
  push:
    branches:
      - 'keddeh/v98-protocol-compliance-deployment-os'
    paths:
      - 'v98_protocol_compliance_config/config/codebase_runtime_registry.json'
      - 'v98_protocol_compliance_config/src/keddeh_unified_codebase_runtime.py'
      - 'v98_protocol_compliance_config/src/keddeh_encoded_medium_storage_runtime_v1.py'
      - 'v98_protocol_compliance_config/tests/test_unified_codebase_runtime.py'
      - 'v98_protocol_compliance_config/tests/test_encoded_medium_storage_runtime_v1.py'
      - '.github/workflows/v114-unified-codebase-runtime.yml'
  pull_request:
    paths:
      - 'v98_protocol_compliance_config/config/codebase_runtime_registry.json'
      - 'v98_protocol_compliance_config/src/keddeh_unified_codebase_runtime.py'
      - 'v98_protocol_compliance_config/src/keddeh_encoded_medium_storage_runtime_v1.py'
      - 'v98_protocol_compliance_config/tests/test_unified_codebase_runtime.py'
      - 'v98_protocol_compliance_config/tests/test_encoded_medium_storage_runtime_v1.py'
      - '.github/workflows/v114-unified-codebase-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v114-unified-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-target-host:
    name: Resolve target-host availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run_m3: ${{ steps.resolve.outputs.should_run_m3 }}
    steps:
      - name: Resolve existing KEDDEH M3 availability signal
        id: resolve
        env:
          M3_AVAILABLE: ${{ vars.KEDDEH_M3_AVAILABLE }}
        run: |
          if [[ "${M3_AVAILABLE:-false}" == "true" ]]; then
            echo "should_run_m3=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run_m3=false" >> "$GITHUB_OUTPUT"
          fi

  unified-runtime:
    name: Portable BRAINK/KEX recursive runtime
    needs: resolve-target-host
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v98_protocol_compliance_config
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read back execution carrier
        run: |
          uname -a
          uname -m
          python3 --version

      - name: Compile unified runtime and tests
        run: |
          python3 -m compileall -q \
            src/keddeh_unified_codebase_runtime.py \
            src/keddeh_encoded_medium_storage_runtime_v1.py \
            tests/test_unified_codebase_runtime.py \
            tests/test_encoded_medium_storage_runtime_v1.py

      - name: Execute supervisor and encoded-medium tests
        run: |
          python3 -m unittest tests.test_unified_codebase_runtime -v
          python3 -m unittest tests.test_encoded_medium_storage_runtime_v1 -v

      - name: Execute registered codebase runtimes and descendants
        run: |
          mkdir -p evidence runtime_volume/outbox/unified_runtime
          python3 src/keddeh_unified_codebase_runtime.py \
            --root . \
            --registry config/codebase_runtime_registry.json \
            --emit-receipt \
            | tee evidence/unified_codebase_runtime_cli.json

      - name: Assert operational receipt, recursive execution and readback
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt_path = Path('evidence/unified_codebase_runtime_receipt.json')
          payload = json.loads(receipt_path.read_text())
          receipt = payload['receipt']
          results = {item['runtime_id']: item for item in payload['runtime_results']}
          encoded = results['runtime://keddeh/encoded-medium-machine']

          assert receipt['runtimes_declared'] >= 8
          assert receipt['runtimes_executed'] >= 1
          assert receipt['ledger_readback_passed'] is True
          assert receipt['global_stop'] is False
          assert receipt['overall_state'] in {'OPERATIONAL', 'OPERATIONAL_DEGRADED'}
          assert receipt['continuation_steps_executed'] >= 3

          assert encoded['state'] == 'SUCCESS'
          assert encoded['continuation_state'] == 'CONTINUED'
          assert encoded['continuation_steps'] >= 3
          assert len(encoded['continuation_receipts']) >= 3

          handoff = json.loads(Path('runtime_volume/outbox/encoded_medium_reconciliation/authoritative.handoff.json').read_text())
          snapshot = json.loads(Path('runtime_volume/encoded_medium/current.json').read_text())
          assert handoff['state'] == 'VERIFIED'
          assert handoff['next_operation'] == 'instantiate_child_auto'
          assert handoff['current_machine']['generation'] >= 5
          assert handoff['snapshot_proof'] == snapshot['proof']

          assert Path('runtime_volume/unified_runtime.ledger.jsonl').is_file()
          assert Path('runtime_volume/outbox/unified_runtime/current.handoff.json').is_file()
          PY

      - name: Upload portable runtime receipts and state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v114-unified-codebase-runtime-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            v98_protocol_compliance_config/evidence/unified_codebase_runtime_receipt.json
            v98_protocol_compliance_config/evidence/unified_codebase_runtime_cli.json
            v98_protocol_compliance_config/evidence/encoded_medium_reconciliation_receipt.json
            v98_protocol_compliance_config/evidence/encoded_medium_continuation_receipt.json
            v98_protocol_compliance_config/runtime_volume/encoded_medium/current.json
            v98_protocol_compliance_config/runtime_volume/encoded_medium/continuation.ledger.jsonl
            v98_protocol_compliance_config/runtime_volume/unified_runtime.ledger.jsonl
            v98_protocol_compliance_config/runtime_volume/outbox/encoded_medium_reconciliation/authoritative.handoff.json
            v98_protocol_compliance_config/runtime_volume/outbox/unified_runtime/current.handoff.json
            skills/keddeh-engineering-orchestrator/enterprise/runtime/enterprise-portfolio.sqlite3

  m3-target-host-acceptance:
    name: Optional KEDDEH M3 target-host acceptance
    needs: [resolve-target-host, unified-runtime]
    if: needs.resolve-target-host.outputs.should_run_m3 == 'true'
    runs-on: [self-hosted, macOS, ARM64, KEDDEH-M3]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Execute existing M3 host acceptance mechanic
        run: |
          cd v98_protocol_compliance_config
          bash scripts/install.command
          python3 src/keddeh_target_host_receipts.py --root . --emit-receipt
          bash scripts/run_m3_host_acceptance.command
      - name: Upload M3 target-host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v114-keddeh-m3-target-host-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            v98_protocol_compliance_config/evidence/m3_host_readiness_receipt.json
            v98_protocol_compliance_config/runtime_volume/m3_host/
