<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRAINK Sites Control Plane</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color-scheme:dark;background:#090b10;color:#eef2ff}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;border-bottom:1px solid #293041;display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font-weight:800;letter-spacing:.08em}.muted{color:#9aa6bd}.grid{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 74px)}aside{border-right:1px solid #293041;padding:18px}.main{padding:24px;max-width:1200px}.card{background:#111621;border:1px solid #293041;border-radius:14px;padding:18px;margin-bottom:16px}button,input,textarea,select{font:inherit;border:1px solid #364158;border-radius:9px;background:#0c111a;color:#eef2ff;padding:10px}button{cursor:pointer;font-weight:700}button:hover{background:#182133}.site{width:100%;text-align:left;margin:5px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.status{font-family:ui-monospace,monospace;font-size:12px}.ok{color:#84e1a6}.bad{color:#ff9a9a}pre{white-space:pre-wrap;word-break:break-word;background:#090d14;padding:14px;border-radius:10px;overflow:auto}textarea{width:100%;min-height:260px}h1,h2,h3{margin-top:0}@media(max-width:760px){.grid{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #293041}}
</style></head><body><header><div><div class="brand">BRAINK × KEX SITES</div><div class="muted">Owner control plane. Site identity survives agent sessions.</div></div><div id="health" class="status">checking…</div></header><div class="grid"><aside><button onclick="newSite()">+ New site</button><div id="sites"></div></aside><main class="main"><div id="view"><div class="card"><h2>Site estate</h2><p class="muted">Select a site or create one. Versions are immutable snapshots. Deployments require readback receipts. Provider adapters never claim success without evidence.</p></div></div></main></div>
<script>
const A='/api';let current=null;const token=()=>localStorage.getItem('kex_sites_token')||'';async function api(path,opt={}){opt.headers={'Content-Type':'application/json',...(opt.headers||{})};if(token())opt.headers.Authorization='Bearer '+token();let r=await fetch(A+path,opt),j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}
async function load(){let h=await api('/health');health.textContent=h.ok?'LEDGER '+(h.ledger.ok?'VERIFIED':'FAILED'):'DOWN';health.className='status '+(h.ledger.ok?'ok':'bad');let x=await api('/sites');sites.innerHTML=x.sites.map(s=>'<button class="site" onclick="openSite(\''+s.id+'\')"><b>'+esc(s.name)+'</b><br><span class="muted">'+esc(s.slug)+' · '+esc(s.state)+'</span></button>').join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function openSite(id){current=await api('/sites/'+id);view.innerHTML='<div class="card"><h2>'+esc(current.name)+'</h2><div class="muted">'+esc(current.id)+' · '+esc(current.state)+'</div></div><div class="card"><h3>Domains</h3>'+current.domains.map(d=>'<div>'+esc(d.hostname)+' · '+esc(d.state)+'</div>').join('')+'<div class="row"><input id="domain" placeholder="example.com"><button onclick="addDomain()">Bind domain</button></div></div><div class="card"><h3>Create immutable version</h3><input id="msg" placeholder="Version message"><textarea id="source" spellcheck="false"><!doctype html>\n<html><body><h1>'+esc(current.name)+'</h1></body></html></textarea><button onclick="version()">Create version</button></div><div class="card"><h3>Versions</h3>'+current.versions.map(v=>'<div><b>#'+v.ordinal+'</b> '+esc(v.id)+' <span class="muted">'+esc(v.source_sha256.slice(0,16))+'</span> <button onclick="deploy(\''+v.id+'\')">Deploy local</button></div>').join('')+'</div><div class="card"><h3>Public readback</h3><div class="row"><input id="readurl" placeholder="https://example.com"><button onclick="readback()">Verify</button></div><pre id="out"></pre></div><div class="card"><h3>Deployments</h3><pre>'+esc(JSON.stringify(current.deployments,null,2))+'</pre></div>'}
async function newSite(){let slug=prompt('Site slug');if(!slug)return;let name=prompt('Site name',slug)||slug;let s=await api('/sites',{method:'POST',body:JSON.stringify({slug,name})});await load();openSite(s.id)}
async function addDomain(){await api('/sites/'+current.id+'/domains',{method:'POST',body:JSON.stringify({hostname:domain.value})});openSite(current.id)}
async function version(){await api('/sites/'+current.id+'/versions',{method:'POST',body:JSON.stringify({message:msg.value,files:{'index.html':source.value}})});openSite(current.id)}
async function deploy(id){await api('/sites/'+current.id+'/deploy',{method:'POST',body:JSON.stringify({version_id:id,adapter:'local'})});openSite(current.id)}
async function readback(){out.textContent='checking…';out.textContent=JSON.stringify(await api('/sites/'+current.id+'/readback',{method:'POST',body:JSON.stringify({url:readurl.value})}),null,2)}
load().catch(e=>{health.textContent=e.message;health.className='status bad'})
</script></body></html>
