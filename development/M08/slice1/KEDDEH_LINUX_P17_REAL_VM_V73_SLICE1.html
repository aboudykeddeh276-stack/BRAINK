<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRAINK M08 Slice 1 · V73 carrier identity</title></head><body><div id="screen_container"><div></div><canvas style="display:none"></canvas></div><pre id="serial-log"></pre><script>
'use strict';
const LOCAL={lib:'assets/libv86.js',wasm:'assets/v86.wasm',bios:'assets/seabios.bin',vga:'assets/vgabios.bin',kernel:'assets/buildroot-bzimage68.bin'};
const REMOTE={lib:'https://github.com/copy/v86/releases/download/latest/libv86.js',wasm:'https://github.com/copy/v86/releases/download/latest/v86.wasm',bios:'https://raw.githubusercontent.com/copy/v86/e37189a/bios/seabios.bin',vga:'https://raw.githubusercontent.com/copy/v86/e37189a/bios/vgabios.bin',kernel:'https://i.copy.sh/buildroot-bzimage68.bin'};
const SLICE1_PAYLOAD=`BRAINK_SLICE1_IDENTITY_V1\ntransport=serial0\ncarrier=KEDDEH_LINUX_P17_REAL_VM_V72\n`;
const state={serial:'',proof:{},slice1HostSha256:'UNOBSERVED',slice1Identity:'UNOBSERVED',bootstrapSent:false};
let emulator=null,assets=REMOTE;
async function hostSha256(text){const b=new TextEncoder().encode(text),d=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function sendChunked(text){return new Promise(resolve=>{let i=0;function step(){if(!emulator)return resolve();const chunk=text.slice(i,i+160);if(!chunk)return resolve();emulator.serial0_send(chunk);i+=chunk.length;setTimeout(step,12)}step()})}
async function sendSlice1Identity(){state.slice1HostSha256=await hostSha256(SLICE1_PAYLOAD);const cmd="cat >/tmp/kex-slice1-payload <<'__KEX_SLICE1_PAYLOAD__'\n"+SLICE1_PAYLOAD+"__KEX_SLICE1_PAYLOAD__\nH=$(sha256sum /tmp/kex-slice1-payload 2>/dev/null | awk '{print $1}')\nif [ -z \"$H\" ] && command -v busybox >/dev/null 2>&1; then H=$(busybox sha256sum /tmp/kex-slice1-payload | awk '{print $1}'); fi\nprintf '%s\\n' 'KEX_SLICE1_PROOF_BEGIN'\nprintf 'KEX_SLICE1_GUEST_SHA256=%s\\n' \"$H\"\nprintf '%s\\n' 'KEX_SLICE1_PROOF_END'\n";await sendChunked(cmd)}
async function injectGuest(){if(state.bootstrapSent||!emulator)return;state.bootstrapSent=true;await sendSlice1Identity()}
function parseSerial(){const s=state.serial;if(s.includes('KEX_SLICE1_PROOF_END')){const b=s.slice(s.lastIndexOf('KEX_SLICE1_PROOF_BEGIN'));const m=b.match(/KEX_SLICE1_GUEST_SHA256=([0-9a-f]{64})/i);if(m){state.proof.KEX_SLICE1_GUEST_SHA256=m[1].toLowerCase();if(state.proof.KEX_SLICE1_GUEST_SHA256===state.slice1HostSha256)state.slice1Identity='MATCH';else state.slice1Identity='MISMATCH';document.title='BRAINK Slice 1 · '+state.slice1Identity}}if(!state.bootstrapSent&&/\n[^\n]*#\s*$/.test(s))injectGuest()}
async function boot(){const C=globalThis.V86||globalThis.V86Starter;if(!C)throw new Error('V86_CONSTRUCTOR_NOT_BOUND');emulator=globalThis.emulator=new C({wasm_path:assets.wasm,memory_size:128*1024*1024,vga_memory_size:8*1024*1024,screen_container:document.getElementById('screen_container'),bios:{url:assets.bios},vga_bios:{url:assets.vga},bzimage:{url:assets.kernel},cmdline:'console=ttyS0,115200n8 console=tty0 rw',acpi:false,autostart:true});emulator.add_listener('serial0-output-byte',byte=>{const c=String.fromCharCode(byte);state.serial+=c;if(state.serial.length>300000)state.serial=state.serial.slice(-250000);document.getElementById('serial-log').textContent+=c;parseSerial()})}
const script=document.createElement('script');script.src=assets.lib;script.onload=boot;script.onerror=()=>{throw new Error('V86_LIBRARY_LOAD_FAILED')};document.head.appendChild(script);
</script></body></html>
