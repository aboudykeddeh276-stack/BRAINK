services:
  braink-runtime:
    build: .
    environment:
      BRAINK_DATA_DIR: /data
      BRAINK_AUTH_TOKEN: ${BRAINK_AUTH_TOKEN:-change-me}
      BRAINK_TIMEZONE: ${BRAINK_TIMEZONE:-Australia/Adelaide}
      BRAINK_GOOGLE_CREDENTIALS: ${BRAINK_GOOGLE_CREDENTIALS:-/secrets/credentials.json}
      BRAINK_GOOGLE_TOKEN: ${BRAINK_GOOGLE_TOKEN:-/secrets/token.json}
      BRAINK_TELEMETRY_SPREADSHEET_ID: ${BRAINK_TELEMETRY_SPREADSHEET_ID:-1nGeP43FHviLsVzM58Tp4RIMXG1MYs_51Wda8gtbfOVo}
      BRAINK_TELEMETRY_RANGE: ${BRAINK_TELEMETRY_RANGE:-TCP_SOCKET_TELEMETRY!B11:N17}
      BRAINK_STRATUM_WORKER: ${BRAINK_STRATUM_WORKER:-}
      BRAINK_STRATUM_PASSWORD: ${BRAINK_STRATUM_PASSWORD:-x}
    ports: ["8000:8000"]
    volumes:
      - braink-data:/data
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  telemetry-qualifier:
    build: .
    depends_on:
      braink-runtime:
        condition: service_healthy
    environment:
      BRAINK_DATA_DIR: /data
      BRAINK_LOCAL_URL: http://braink-runtime:8000
      BRAINK_AUTH_TOKEN: ${BRAINK_AUTH_TOKEN:-change-me}
    volumes:
      - braink-data:/data
    command: ["python", "/app/scripts/qualify_live_telemetry.py"]
    restart: "no"

volumes:
  braink-data: {}
