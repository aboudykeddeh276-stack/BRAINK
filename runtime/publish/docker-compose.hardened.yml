services:
  braink-runtime:
    build:
      context: .
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      BRAINK_DATA_DIR: /data
      BRAINK_OPERATOR_AUTHORITY: ${BRAINK_OPERATOR_AUTHORITY?required}
      BRAINK_AUTH_TOKEN: ${BRAINK_AUTH_TOKEN?required}
      BRAINK_TIMEZONE: ${BRAINK_TIMEZONE:-Australia/Adelaide}
    volumes:
      - braink-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    cpus: "2.0"
    mem_limit: 2g
    restart: unless-stopped

volumes:
  braink-data:
